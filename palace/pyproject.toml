[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-palace"
version = "0.1.0"
description = "Claude Code Memory Palace — project context manager with TUI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=0.60.0",
    "rich>=13.0.0",
]

[project.scripts]
palace = "palace.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/palace"]
